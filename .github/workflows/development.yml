name: Development build
on:
  push:
    branches: [main, 'issues/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pinned test runtime
        run: python -m pip install -r requirements-dev.txt
      - name: Repository and privacy checks
        run: python tools/check_repository.py --source-only
      - name: Lua 5.1 mocked client regression tests
        run: python tests/run-tests.py
      - name: Package exact clean commit (Refs issues 1, 2, 3, 4, 5, 8, 9, 10, 11, 13, 15, 16, 17, 19, 20, 22, 23, 24, 26, 27, 29)
        run: python tests/verify-package.py --development --issues 1 2 3 4 5 8 9 10 11 13 15 16 17 19 20 22 23 24 26 27 29
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BetterLKFrames-dev-${{ github.sha }}
          path: dist/BetterLKFrames-dev-*
          if-no-files-found: error
          retention-days: 30
